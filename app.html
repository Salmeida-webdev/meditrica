const API='/.netlify/functions/api?path=';const root=document.querySelector('#root');let me=null,active='overview',items=[],editing=null,resource='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts={}){const r=await fetch(API+encodeURIComponent(path),{credentials:'same-origin',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});const data=await r.json().catch(()=>({error:'Falha de comunicação.'}));if(!r.ok)throw new Error(data.error||'Não foi possível concluir.');return data}function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

const pages={appointments:{title:'Agenda e recepção',desc:'Agendamentos fictícios por unidade e profissional.',res:'appointments',fields:[['unit_id','Unidade (ID)','text'],['patient_id','Paciente (ID)','text'],['professional_id','Profissional (ID)','text'],['service_id','Serviço (ID)','text'],['starts_at','Início','datetime-local'],['ends_at','Fim','datetime-local'],['status','Status','select',['Agendado','Confirmado','Em recepção','Em atendimento','Concluído','Falta','Cancelado']],['notes','Observação demonstrativa','text']]},patients:{title:'Pacientes',desc:'Cadastros e jornada do paciente — dados sintéticos.',res:'patients',fields:[['unit_id','Unidade (ID)','text'],['code','Código fictício','text'],['full_name','Nome fictício','text'],['phone','Telefone fictício','tel'],['email','E-mail fictício','email'],['birth_date','Nascimento fictício','date'],['source','Origem','select',['Indicação','Busca online','Retorno','Outros']],['status','Situação','select',['Ativo','Retorno','Aguardando','Inativo']],['notes','Observação administrativa fictícia','textarea']]},clinical_records:{title:'Prontuários e documentos',desc:'Estrutura de registros fictícios, sem conteúdo assistencial real.',res:'clinical_records',fields:[['unit_id','Unidade (ID)','text'],['patient_id','Paciente (ID)','text'],['appointment_id','Atendimento (ID)','text'],['professional_id','Profissional (ID)','text'],['record_type','Tipo de registro','select',['Anamnese demonstrativa','Evolução demonstrativa','Triagem demonstrativa']],['summary','Resumo fictício sem dado clínico','textarea'],['status','Status','select',['Rascunho','Revisão','Concluído']]]},documents:{title:'Documentos',desc:'Modelos e emissão demonstrativa, sem documentos clínicos válidos.',res:'documents',fields:[['unit_id','Unidade (ID)','text'],['patient_id','Paciente (ID)','text'],['appointment_id','Atendimento (ID)','text'],['professional_id','Profissional (ID)','text'],['document_type','Tipo','select',['Modelo de declaração','Modelo de enc lacionamento e tarefas',desc:'Comunicações demonstrativas e acompanhamento operacional.',res:'communications',fields:[['unit_id','Unidade (ID)','text'],['patient_id','Paciente (ID)','text'],['channel','Canal','select',['E-mail fictício','SMS fictício','WhatsApp simulado']],['subject','Assunto demonstrativo','text'],['status','Status','select',['Programada','Enviada (demo)','Pendente','Cancelada']],['scheduled_at','Agendamento','datetime-local'],['consent_status','Consentimento (demo)','select',['Fictício','Confirmado no demo','Não informado']]]},platform_subscriptions:{title:'Administração da SaaS',desc:'Visão ilustrativa do plano e limites da conta de demonstração.',res:'platform_subscriptions',fields:[['plan_name','Plano','text'],['status','Situação','select',['Demo ativa','Ativa','Em análise']],['seats','Licenças demonstrativas','number'],['renews_at','Renovação prevista','date']]}};
function header(){return `<aside class="sidebar" id="sidebar"><a class="brand" href="/"><span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18V6l8 8 8-8v12M4 11h4m8 0h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>medítrica</a><div class="section">Visão de gestão</div><nav class="nav">${nav.slice(0,2).map(nbtn).join('')}</nav><div class="section">Operação clínica</div><nav class="nav">${nav.slice(2,5).map(nbtn).join('')}</nav><div class="section">Gestão da clínica</div><nav class="nav">${nav.slice(5).map(nbtn).join('')}</nav><div class="user"><span class="avatar">${esc((me.name||'MD').split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div><strong>${esc(me.name)}</strong><small>${esc(me.clinic)} · demonstração</small></div><button id="logout" title="Sair">↗</button></div></aside><main><header class="top"><div class="top-left"><button class="mobile-menu" id="menu">☰</button><span class="crumb">Medítrica <b>/ ${esc(nav.find(x=>x[0]===active)?.[1]||'Gestão')}</b></span></div><div class="top-right"><span class="demo-badge">Demo · dados fictícios</span></div></header><section class="content"><div class="alert"><strong>Ambiente de demonstração:</strong> todos os registros são fictícios. Não insira dados reais nem use para atendimento clínico.</div><div id="view"></div></section></main>`}function nbtn(n){return `<button class="${active===n[0]?'active':''}" data-page="${n[0]}"><span class="ico">${n[2]}</span>${n[1]}</button>`}
function money(c){return (Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function statsCards(data){return `<div class="cards"><article class="card"><small>Pacientes fictícios</small><strong>${data.patients}</strong><em>na base demonstrativa</em></article><article class="card"><small>Agendamentos</small><strong>${data.appointments}</strong><em>${data.todayAppointments} para hoje</em></article><article class="card"><small>Recebido (demo)</small><strong>${money(data.receiptsCents)}</strong><em>valores sintéticos</em></article><article class="card"><small>Pendências</small><strong>${data.openTasks+data.lowStock+data.claimsInReview}</strong><em>${data.lowStock} itens de estoque em reposição</em></article></div>`}
async function renderOverview(){const d=await api('api/summary');return `<div class="heading"><div><h1>Visão da clínica</h1><p>Resumo operacional de demonstração · ${new Date().toLocaleDateString('pt-BR')}</p></div><button class="btn secondary" id="exportSummary">Exportar CSV</button></div>${statsCards(d)}<div class="cols"><section class="panel"><div class="panel-head"><h2>Fluxos da operação</h2><small>Dados fictícios</small></div><div class="progress"><div class="progress-row"><span>Agenda preenchida</span><b>82%</b></div><div class="track"><i style="width:82%"></i></div><div class="progress-row"><span>Comparecimento demonstrativo</span><b>91%</b></div><div class="track"><i style="width:91%;background:#8db8a7"></i></div><div class="progress-row"><span>Contas pendentes</span><b>${money(d.pendingExpensesCents)}</b></div><div class="track"><i style="width:38%;background:#d5ae73"></i></div></div></section><section class="panel"><div class="panel-head"><h2>Próximos passos</h2><small>Visão da equipe</small></div><div class="progress"><div class="progress-row"><span>Tarefas em aberto</span><b>${d.openTasks}</b></div><div class="progress-row"><span>Guias em análise</span><b>${d.claimsInReview}</b></div><div class="progress-row"><span>Unidades ativas</span><b>2</b></div><p class="footnote">Indicadores demonstrativos, calculados a partir de dados sintéticos no D1.</p></div></section></div>`}
async function renderAnalytics(){const d=await api('api/summary');const vals=[12,18,15,24,20,29,25],max=Math.max(...vals);return `<div class="heading"><div><h1>Análise e indicadores</h1><p>Indicadores operacionais e financeiros com fonte e período identificados.</p></div><button class="btn secondary" id="exportSummary">Baixar resumo</button></div>${statsCards(d)}<div class="cols"><section class="panel"><div class="panel-head"><h2>Atendimentos por semana</h2><small>Exemplo sintético · últimos 30 dias</small></div><div class="chart-wrap"><div class="chart">${vals.map((v,i)=>`<div class="bar" style="height:${Math.round(v/max*125)}px"><span>S${i+1}</span></div>`).join('')}</div></div><div class="footnote">Série fictícia para demonstração. Não representa desempenho clínico real.</div></section><section class="panel"><div class="panel-head"><h2>Indicadores de gestão</h2><small>Fórmulas em definição</small></div><div class="progress"><div class="progress-row"><span>Ocupação média</span><b>82%</b></div><div class="track"><i style="width:82%"></i></div><div class="progress-row"><span>Taxa de comparecimento</span><b>91,2%</b></div><div class="track"><i style="width:91%;background:#8db8a7"></i></div><div class="progress-row"><span>Faltas na amostra demo</span><b>8,8%</b></div><div class="track"><i style="width:9%;background:#d5ae73"></i></div><p class="footnote">Receita recebida: ${money(d.receiptsCents)} · base sintética em caixa.</p></div></section></div><div class="footnote">Atualizado ${new Date(d.updatedAt).toLocaleString('pt-BR')} · Fuso de referência: America/Sao_Paulo.</div>`}
const resourceConfigs=Object.fromEntries(Object.values(pages).map(p=>[p.res,p]));resourceConfigs.expenses={title:'Despesas',desc:'Contas a pagar e saídas fictícias.',res:'expenses',fields:[['unit_id','Unidade (ID)','text'],['description','Descrição fictícia','text'],['category','Categoria','text'],['amount_cents','Valor em centavos','number'],['status','Situação','select',['A pagar','Pago','Vencido']],['due_date','Vencimento','date'],['settled_at','Liquidação','date']]};resourceConfigs.insurance_claims={title:'Guias e faturamento',desc:'Acompanhamento de guias demonstrativas.',res:'insurance_claims',fields:[['unit_id','Unidade (ID)','text'],['plan_id','Plano (ID)','text'],['patient_id','Paciente (ID)','text'],['reference_code','Referência fictícia','text'],['amount_cents','Valor em centavos','number'],['status','Status','select',['Em análise','Enviada','Autorizada','Glosa em recurso']],['submitted_at','Envio','date']]};resourceConfigs.units={title:'Unidades',desc:'Unidades demonstrativas da organização.',res:'units',fields:[['name','Nome da unidade','text'],['city','Cidade fictícia','text'],['timezone','Fuso horário','text'],['status','Situação','select',['Ativo','Inativo']] ]};resourceConfigs.services={title:'Serviços',desc:'Serviços e valores demonstrativos.',res:'services',fields:[['name','Nome do serviço','text'],['specialty','Especialidade','text'],['duration_minutes','Duração em minutos','number'],['price_cents','Valor em centavos','number'],['status','Situação','select',['Ativo','Inativo']] ]};resourceConfigs.rooms={title:'Salas e recursos',desc:'Salas e recursos compartilhados demonstrativos.',res:'rooms',fields:[['unit_id','Unidade (ID)','text'],['name','Sala ou recurso','text'],['resource_type','Tipo','text'],['status','Situação','select',['Ativo','Em manutenção','Inativo']] ]};resourceConfigs.suppliers={title:'Fornecedores',desc:'Contatos fictícios de fornecedores.',res:'suppliers',fields:[['name','Fornecedor fictício','text'],['contact','Contato fictício','text'],['email','E-mail fictício','email'],['status','Situação','select',['Ativo','Inativo']] ]};resourceConfigs.tasks={title:'Tarefas operacionais',desc:'Pendências e responsáveis fictícios.',res:'tasks',fields:[['unit_id','Unidade (ID)','text'],['title','Tarefa','text'],['category','Categoria','text'],['assigned_to','Responsável fictício','text'],['due_at','Prazo','datetime-local'],['status','Status','select',['Pendente','Em andamento','Concluída']],['priority','Prioridade','select',['Baixa','Normal','Alta']] ]};const moduleTabs={finance:['payments','expenses'],insurance:['insurance_plans','insurance_claims'],team:['professionals','units','services','rooms','suppliers'],communications:['communications','tasks'],clinical_records:['clinical_records','documents']};const labels={id:'ID',unit_id:'Unidade ID',code:'Código',full_name:'Nome',phone:'Telefone fictício',email:'E-mail fictício',birth_date:'Nascimento',source:'Origem',status:'Situação',notes:'Observação demonstrativa',patient_id:'Paciente ID',professional_id:'Profissional ID',service_id:'Serviço ID',room_id:'Sala ID',starts_at:'Início',ends_at:'Fim',specialty:'Especialidade',registration:'Registro demo',name:'Nome',duration_minutes:'Duração (min)',price_cents:'Preço (centavos)',resource_type:'Tipo de recurso',record_type:'Tipo',summary:'Resumo fictício',appointment_id:'Atendimento ID',document_type:'Tipo de documento',title:'Título',issued_at:'Data',description:'Descrição',amount_cents:'Valor (centavos)',method:'Meio',due_date:'Vencimento',settled_at:'Liquidação',category:'Categoria',registration_code:'Código demo',contact:'Contato fictício',plan_id:'Convênio ID',reference_code:'Referência demo',submitted_at:'Envio',quantity:'Quantidade',minimum_quantity:'Mínimo',unit_label:'Unidade',lot:'Lote demo',expires_on:'Validade',channel:'Canal',subject:'Assunto demo',scheduled_at:'Agendamento',consent_status:'Consentimento demo',assigned_to:'Responsável fictício',due_at:'Prazo',priority:'Prioridade',plan_name:'Plano',seats:'Licenças demo',renews_at:'Renovação',created_at:'Criado em',updated_at:'Atualizado em'};function rowValue(k,v){if(k==='amount_cents'||k==='price_cents')return money(v);if(k==='is_archived')return v?'Arquivado':'Ativo';if(/_at|_date|expires_on|due_date/.test(k)&&v){const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('pt-BR')}return esc(v)}function displayFields(r){return (resourceConfigs[r]?.fields||pages[active]?.fields||[]).map(f=>f[0]).filter(k=>items.length?Object.keys(items[0]).includes(k):true)}
async function renderTable(){const base=pages[active];if(!resource||!(moduleTabs[active]||[]).includes(resource))resource=base.res;const p=resourceConfigs[resource]||base;const d=await api('api/'+resource);items=d.items||[];const fieldsToShow=displayFields(resource);const columns=fieldsToShow.length?fieldsToShow:(items[0]?Object.keys(items[0]).filter(k=>!['tenant_id','is_archived'].includes(k)).slice(0,6):[]);return `<div class="heading"><div><h1>${p.title}</h1><p>${p.desc}</p></div><button class="btn" id="newRecord">＋ Novo registro</button></div>${(moduleTabs[active]||[]).length>1?`<div class="subtabs">${moduleTabs[active].map(r=>`<button class="${resource===r?'active':''}" data-resource="${r}">${esc(resourceConfigs[r]?.title||r)}</button>`).join('')}</div>`:''}<section class="panel"><div class="panel-head"><h2>${items.length} registro(s) demonstrativo(s)</h2><div class="tools"><input class="search" id="filter" placeholder="Filtrar registros…" aria-label="Filtrar registros"><button class="btn secondary" id="exportCsv">Exportar CSV</button></div></div><div class="table-wrap" id="table">${buildTable(columns,items)}</div><div class="footnote">Registros armazenados no banco D1 da demonstração. Exclusões são arquivadas e auditadas.</div></section>`}
function buildTable(cols,rows){if(!rows.length)return '<div class="empty">Nenhum registro. Use “Novo registro” para adicionar um item fictício.</div>';return `<table><thead><tr>${cols.map(k=>`<th>${esc(labels[k]||k)}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows.map(item=>`<tr data-search="${esc(cols.map(k=>item[k]||'').join(' ').toLowerCase())}">${cols.map(k=>`<td>${k==='status'?`<span class="pill">${esc(item[k])}</span>`:rowValue(k,item[k])}</td>`).join('')}<td><div class="actions"><button class="icon-btn" data-edit="${esc(item.id)}">Editar</button><button class="icon-btn" data-archive="${esc(item.id)}">Arquivar</button></div></td></tr>`).join('')}</tbody></table>`}
async function render(){if(!me){location.replace('/login');return}try{const view=document.querySelector('#view');view.innerHTML='<div class="loading">Carregando módulo…</div>';view.innerHTML=active==='overview'?await renderOverview():active==='analytics'?await renderAnalytics():await renderTable();bindView()}catch(e){document.querySelector('#view').innerHTML=`<div class="panel empty">${esc(e.message)} <button class="btn secondary" id="retry">Tentar novamente</button></div>`;document.querySelector('#retry')?.addEventListener('click',render)}}function bindView(){document.querySelector('#newRecord')?.addEventListener('click',()=>openForm());document.querySelector('#exportCsv')?.addEventListener('click',exportRows);document.querySelector('#filter')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#table tbody tr').forEach(tr=>tr.hidden=!tr.dataset.search.includes(q))});document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(items.find(i=>i.id===b.dataset.edit))));document.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click',()=>archive(b.dataset.archive)));document.querySelectorAll('[data-resource]').forEach(b=>b.addEventListener('click',()=>{resource=b.dataset.resource;render()}));document.querySelector('#exportSummary')?.addEventListener('click',()=>toast('Resumo sintético exportado.'))}
function openForm(item=null){editing=item;const p=resourceConfigs[resource]||pages[active];document.querySelector('#formTitle').textContent=(item?'Editar ':'Novo ')+p.title.toLowerCase();const host=document.querySelector('#fields');host.innerHTML=p.fields.map(([key,label,type,choices])=>{let value=item?.[key]??'';if(type==='datetime-local'&&value)value=String(value).slice(0,16);const wide=type==='textarea'?' wide':'';let input=type==='select'?`<select name="${key}">${choices.map(v=>`<option ${value===v?'selected':''}>${v}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" maxlength="2000">${esc(value)}</textarea>`:`<input name="${key}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any"':''} maxlength="2000">`;return `<div class="field${wide}"><label>${esc(label)}${['patients:code','patients:full_name','appointments:starts_at','professionals:full_name','professionals:specialty','services:name','rooms:name','units:name','clinical_records:summary','documents:document_type','documents:title','payments:description','expenses:description','insurance_plans:name','insurance_claims:reference_code','inventory_items:code','inventory_items:name','suppliers:name','communications:subject','tasks:title'].includes(resource+':'+key)?' *':''}</label>${input}</div>`}).join('');document.querySelector('#editor').showModal()}
async function saveForm(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget).entries());for(const [k,v] of Object.entries(data)){if(v==='')delete data[k];else if(['amount_cents','duration_minutes','price_cents','quantity','minimum_quantity','seats'].includes(k))data[k]=Number(v)}try{await api('api/'+resource+(editing?'/'+editing.id:''),{method:editing?'PATCH':'POST',body:JSON.stringify(data)});document.querySelector('#editor').close();toast('Registro fictício salvo e auditado.');render()}catch(e){toast(e.message)}}async function archive(id){if(!confirm('Arquivar este registro demonstrativo?'))return;try{await api('api/'+resource+'/'+id,{method:'DELETE'});toast('Registro arquivado.');render()}catch(e){toast(e.message)}}function exportRows(){if(!items.length){toast('Não há registros para exportar.');return}const keys=Object.keys(items[0]).filter(k=>!['tenant_id'].includes(k));const csv=[keys.join(';'),...items.map(x=>keys.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`meditrica-${resource||active}-demo.csv`;a.click();URL.revokeObjectURL(a.href);toast('CSV demonstrativo baixado.')}document.querySelector('#recordForm').addEventListener('submit',saveForm);document.querySelector('#closeModal').addEventListener('click',()=>document.querySelector('#editor').close());document.querySelector('#cancel').addEventListener('click',()=>document.querySelector('#editor').close());(async()=>{try{const r=await api('auth/me');me=r.user;root.innerHTML=header();document.querySelector('#menu').addEventListener('click',()=>document.querySelector('#sidebar').classList.toggle('open'));document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.page;resource=pages[active]?.res||'';document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===active));document.querySelector('#sidebar').classList.remove('open');render()}));document.querySelector('#logout').addEventListener('click',async()=>{await api('auth/logout',{method:'POST'}).catch(()=>{});location.replace('/login')});render()}catch{location.replace('/login')}})();
</script></body></html>
