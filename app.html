function buildTable(cols,rows){if(!rows.length)return '<div class="empty">Nenhum registro. Use “Novo registro” para adicionar um item.</div>';return `<table><thead><tr>${cols.map(k=>`<th>${esc(labels[k]||k)}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows.map(item=>`<tr data-search="${esc(cols.map(k=>item[k]||'').join('').toLowerCase())}">${cols.map(k=>`<td>${k==='status'?`<span class="pill">${esc(displayValue(item[k]))}</span>`:rowValue(k,item[k])}</td>`).join('')}<td><div class="actions"><button class="icon-btn" data-edit="${esc(item.id)}">Editar</button><button class="icon-btn" data-archive="${esc(item.id)}">Arquivar</button></div></td></tr>`).join('')}</tbody></table>`}
function setSidebarOpen(open){const sidebar=document.querySelector('#sidebar'),menu=document.querySelector('#menu');if(!sidebar||!menu)return;const mobile=window.matchMedia('(max-width:740px)').matches,wasOpen=sidebar.classList.contains('open'),showDrawer=mobile&&open;sidebar.classList.toggle('open',showDrawer);sidebar.inert=mobile&&!showDrawer;sidebar.setAttribute('aria-hidden',String(mobile&&!showDrawer));document.body.classList.toggle('menu-open',showDrawer);menu.setAttribute('aria-expanded',String(showDrawer));menu.setAttribute('aria-label',showDrawer?'Fechar menu':'Abrir menu');if(showDrawer)sidebar.querySelector('[data-page]')?.focus();else if(wasOpen&&mobile)menu.focus()}function goToPage(page){active=page;resource=pages[active]?.res||'';document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===active));const crumb=document.querySelector('.crumb b');if(crumb)crumb.textContent=nav.find(x=>x[0]===active)?.[1]||'Gestão';setSidebarOpen(false);render()}
async function render(){if(!me){location.replace('/login');return}try{const view=document.querySelector('#view');view.innerHTML='<div class="loading">Carregando módulo…</div>';view.innerHTML=active==='overview'?await renderOverview():active==='analytics'?await renderAnalytics():await renderTable();bindView()}catch(e){document.querySelector('#view').innerHTML=`<div class="panel empty">${esc(e.message)} <button class="btn secondary" id="retry">Tentar novamente</button></div>`;document.querySelector('#retry')?.addEventListener('click',render)}}function bindView(){document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>goToPage(b.dataset.jump)));document.querySelector('#newRecord')?.addEventListener('click',()=>openForm());document.querySelector('#exportCsv')?.addEventListener('click',exportRows);document.querySelector('#filter')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#table tbody tr').forEach(tr=>tr.hidden=!tr.dataset.search.includes(q))});document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(items.find(i=>i.id===b.dataset.edit))));document.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click',()=>archive(b.dataset.archive)));document.querySelectorAll('[data-resource]').forEach(b=>b.addEventListener('click',()=>{resource=b.dataset.resource;render()}));document.querySelector('#exportSummary')?.addEventListener('click',()=>toast('Resumo exportado.'))}
function openForm(item=null){editing=item;const p=resourceConfigs[resource]||pages[active];document.querySelector('#formTitle').textContent=(item?'Editar ':'Novo ')+p.title.toLowerCase();const host=document.querySelector('#fields');host.innerHTML=p.fields.map(([key,label,type,choices])=>{let value=item?.[key]??'';if(type==='datetime-local'&&value)value=String(value).slice(0,16);const wide=type==='textarea'?' wide':'';let input=type==='select'?`<select name="${key}">${choices.map(v=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(displayValue(v))}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" maxlength="2000">${esc(displayValue(value))}</textarea>`:`<input name="${key}" type="${type}" value="${esc(displayValue(value))}" ${type==='number'?'step="any"':''} maxlength="2000">`;return `<div class="field${wide}"><label>${esc(label)}${['patients:code','patients:full_name','appointments:starts_at','professionals:full_name','professionals:specialty','services:name','rooms:name','units:name','clinical_records:summary','documents:document_type','documents:title','payments:description','expenses:description','insurance_plans:name','insurance_claims:reference_code','inventory_items:code','inventory_items:name','suppliers:name','communications:subject','tasks:title'].includes(resource+':'+key)?'*':''}</label>${input}</div>`}).join('');document.querySelector('#editor').showModal()}
async function saveForm(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget).entries());for(const [k,v] of Object.entries(data)){if(v==='')delete data[k];else if(['amount_cents','duration_minutes','price_cents','quantity','minimum_quantity','seats'].includes(k))data[k]=Number(v)}try{await api('api/'+resource+(editing?'/'+editing.id:''),{method:editing?'PATCH':'POST',body:JSON.stringify(data)});document.querySelector('#editor').close();toast('Registro salvo e auditado.');render()}catch(e){toast(e.message)}}async function archive(id){if(!confirm('Arquivar este registro?'))return;try{await api('api/'+resource+'/'+id,{method:'DELETE'});toast('Registro arquivado.');render()}catch(e){toast(e.message)}}function exportRows(){if(!items.length){toast('Não há registros para exportar.');return}const keys=Object.keys(items[0]).filter(k=>!['tenant_id'].includes(k));const csv=[keys.join(';'),...items.map(x=>keys.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`meditrica-${resource||active}.csv`;a.click();URL.revokeObjectURL(a.href);toast('CSV baixado.')}document.querySelector('#recordForm').addEventListener('submit',saveForm);document.querySelector('#closeModal').addEventListener('click',()=>document.querySelector('#editor').close());document.querySelector('#cancel').addEventListener('click',()=>document.querySelector('#editor').close());(async()=>{try{const r=await api('auth/me');me=r.user;root.innerHTML=header();setSidebarOpen(false);window.matchMedia('(max-width:740px)').addEventListener('change',()=>setSidebarOpen(false));document.querySelector('#menu').setAttribute('aria-controls','sidebar');document.querySelector('#menu').addEventListener('click',()=>setSidebarOpen(!document.querySelector('#sidebar').classList.contains('open')));document.querySelector('#sidebarScrim').addEventListener('click',()=>setSidebarOpen(false));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#sidebar').classList.contains('open'))setSidebarOpen(false)});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>goToPage(b.dataset.page)));document.querySelector('#logout').addEventListener('click',async()=>{await api('auth/logout',{method:'POST'}).catch(()=>{});location.replace('/login')});render()}catch{location.replace('/login')}})();
</script></body></html>
