:root{--ink:#292235;--muted:#7e7885;--paper:#f7f5f3;--line:#ebe7e4;--mint:#f0eaf2;--coral:#e8755b;--green:#4b8b78}
.layout{grid-template-columns:258px minmax(0,1fr)}
.sidebar{background:#2d2538;color:#fff;padding:22px 15px}
.brand{color:#fff;font-size:19px;padding-bottom:24px}
.mark{background:#fff;color:var(--ink);width:34px;height:34px;border-radius:12px}
.section{color:#aaa2b4;padding:14px 11px 7px}
.nav{gap:4px}
.nav button{color:#d4cfda;border-radius:10px;padding:10px 11px;gap:12px;font-size:12px}
.nav button:hover{background:#3b3247;color:#fff}
.nav button.active{background:#f1eaf3;color:#30253b;box-shadow:inset 3px 0 var(--coral)}
.nav .ico{color:#e39b87;font-size:14px}
.nav button.active .ico{color:#80584c}
.user{border-color:#4c4357}
.user small{color:#c1bac9}
.user button{border:1px solid #574e62;border-radius:9px;padding:7px 9px;color:#e4dce8}
.layout>main{min-width:0}
.top{height:70px;background:#fff;padding:0 34px}
.content{max-width:1480px;padding:25px 34px 48px}
.alert{border-radius:12px;padding:11px 15px;font-size:11px;margin-bottom:25px}
.heading h1{font-size:29px}
.heading p{font-size:13px}
.btn{border-radius:10px;padding:11px 15px;font-size:12px}
.cards{gap:14px;margin:19px 0 22px}
.card{border-radius:16px;padding:18px;min-height:132px}
.card small{font-size:11px}.card strong{font-size:27px;margin:12px 0 4px}.card em{font-size:10px}
.panel{border-radius:16px;margin-top:14px}
.panel-head{padding:16px 19px}.panel-head h2{font-size:15px}.panel-head small{font-size:11px}
.cols{grid-template-columns:1.3fr .9fr;gap:16px}
.dashboard-banner{background:linear-gradient(115deg,#342a40,#54445e);color:#fff;border-radius:20px;padding:25px 27px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;overflow:hidden}
.dashboard-banner h1{font-size:27px;margin:0 0 5px;position:relative;z-index:1}.dashboard-banner p{margin:0;color:#ddd5e2;font-size:12px;position:relative;z-index:1}.dashboard-banner .btn{position:relative;z-index:1;background:#fff;color:var(--ink)}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.8fr);gap:16px;margin-top:16px}
.schedule-list,.task-list{padding:4px 19px 14px}
.schedule-item{display:grid;grid-template-columns:60px 1fr auto;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid #f0edeb}
.schedule-item:last-child,.task-item:last-child{border-bottom:0}
.schedule-time{font-size:12px;font-weight:750;color:#655b6d}
.schedule-person{display:flex;align-items:center;gap:10px}
.schedule-person .avatar{width:34px;height:34px}
.schedule-person strong,.task-item strong{display:block;font-size:12px}
.schedule-person small,.task-item small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.schedule-status{font-size:10px;background:#edf5f1;color:#477968;padding:6px 9px;border-radius:20px;white-space:nowrap}
.schedule-status.pending{background:#fff3e5;color:#98652b}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f0edeb}
.task-dot{width:9px;height:9px;border-radius:50%;background:var(--coral);margin-top:4px;flex:none}
.shortcut-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.shortcut{border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;text-align:left;color:var(--ink);display:flex;align-items:center;gap:11px}
.shortcut:hover{border-color:#d3c5d8;background:#fdfbfe}
.shortcut i{width:36px;height:36px;border-radius:11px;background:var(--mint);display:grid;place-items:center;color:#594866;font-style:normal}
.shortcut strong{font-size:11px}.shortcut small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
@media(max-width:1150px){.layout{grid-template-columns:235px minmax(0,1fr)}.content{padding-left:24px;padding-right:24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.dashboard-grid,.cols{grid-template-columns:1fr}}
@media(max-width:740px){.layout{display:block}.top{height:62px;padding:0 14px}.content{padding:16px 14px 32px}.heading h1{font-size:22px}.dashboard-banner{padding:21px;align-items:flex-start;flex-direction:column}.dashboard-banner h1{font-size:23px}.schedule-item{grid-template-columns:48px 1fr;gap:8px}.schedule-status{grid-column:2;justify-self:start}.shortcut-row{grid-template-columns:1fr}.tools{flex-wrap:wrap;justify-content:flex-end}}
:root{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px)}
body{overflow-x:hidden}
.sidebar-scrim{display:none}
@media(max-width:850px){.layout{grid-template-columns:228px minmax(0,1fr)}.content{padding-left:22px;padding-right:22px}.dashboard-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:740px){
  .layout{display:block}
  .sidebar{position:fixed;z-index:6;left:0;top:0;width:min(84vw,320px);height:100vh;height:100dvh;padding:calc(18px + var(--safe-top)) 14px calc(16px + var(--safe-bottom)) max(14px,var(--safe-left));overflow-y:auto;overscroll-behavior:contain;transform:translateX(-105%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-scrim{position:fixed;inset:0;z-index:5;display:none;border:0;background:#21182d99;touch-action:manipulation}
  body.menu-open{overflow:hidden}
  body.menu-open .sidebar-scrim{display:block}
  .mobile-menu{display:grid;place-items:center;width:44px;height:44px;margin-right:8px;touch-action:manipulation}
  .mobile-menu:focus-visible,.nav button:focus-visible,.sidebar-scrim:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
  .nav button{min-height:44px}
  .top{height:64px;padding:0 max(14px,var(--safe-right)) 0 max(14px,var(--safe-left))}
  .top-left{display:flex;align-items:center;min-width:0;flex:1}
  .crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top-right{flex:none;margin-left:8px}
  .content{padding:17px max(14px,var(--safe-right)) calc(34px + var(--safe-bottom)) max(14px,var(--safe-left))}
  .heading{flex-wrap:wrap;align-items:flex-start}
  .heading h1{font-size:22px}
  .heading p{line-height:1.5}
  .heading .btn{min-height:44px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .card{min-width:0;padding:13px;min-height:118px}
  .card strong{font-size:21px;overflow-wrap:anywhere}
  .card small,.card em{line-height:1.45}
  .dashboard-grid,.cols{grid-template-columns:minmax(0,1fr)}
  .schedule-item{grid-template-columns:48px minmax(0,1fr);gap:8px}
  .schedule-person{min-width:0}
  .schedule-person>span{min-width:0}
  .schedule-person strong,.schedule-person small{overflow-wrap:anywhere}
  .schedule-status{grid-column:2;justify-self:start}
  .shortcut-row{grid-template-columns:minmax(0,1fr)}
  .panel-head{gap:10px}
  .panel-head h2{line-height:1.35}
  .table-panel>.panel-head{flex-direction:column;align-items:stretch}
  .tools{display:grid;grid-template-columns:minmax(0,1fr) auto;width:100%}
  .search{width:100%;min-width:0;height:44px;font-size:16px}
  .tools .btn{min-height:44px;padding:9px 10px;white-space:nowrap}
  .table-wrap{max-width:100%;overflow:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .table-wrap table{min-width:680px}
  .icon-btn,.subtabs button{min-height:40px}
  .subtabs{overflow-x:auto;flex-wrap:nowrap;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .subtabs button{white-space:nowrap}
  .modal{width:calc(100% - 24px);max-width:590px;max-height:calc(100dvh - 24px);overflow:hidden}
  .modal form{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
  .form-grid{grid-template-columns:minmax(0,1fr);max-height:none;min-height:0;flex:1;overflow:auto;padding:16px}
  .field.wide{grid-column:auto}
  .field input,.field select,.field textarea{font-size:16px;min-height:44px}
  .modal-foot{padding:12px 16px calc(12px + var(--safe-bottom))}
  .modal-foot .btn{min-height:44px}
  .toast{right:max(14px,var(--safe-right));bottom:calc(14px + var(--safe-bottom));max-width:calc(100vw - 28px)}
}
@media(max-width:390px){
  .top{padding-left:max(10px,var(--safe-left));padding-right:max(10px,var(--safe-right))}
  .mobile-menu{width:42px;height:42px;margin-right:5px}
  .crumb{font-size:10px}
  .content{padding-left:max(11px,var(--safe-left));padding-right:max(11px,var(--safe-right))}
  .cards{gap:7px}
  .card{padding:11px}
  .card small{font-size:10px}
  .card strong{font-size:19px}
  .panel-head{padding:12px}
  .tools{grid-template-columns:minmax(0,1fr)}
  .tools .btn{width:100%}
  .schedule-list,.task-list{padding-left:12px;padding-right:12px}
  .schedule-item{grid-template-columns:43px minmax(0,1fr);gap:7px}
  .schedule-time{font-size:11px}
}
@media(prefers-reduced-motion:reduce){.sidebar{transition:none!important}.nav button,.btn,.icon-btn{transition:none!important}}

async function render(){if(!me){location.replace('/login');return}try{const view=document.querySelector('#view');view.innerHTML='<div class="loading">Carregando módulo…</div>';view.innerHTML=active==='overview'?await renderOverview():active==='analytics'?await renderAnalytics():await renderTable();bindView()}catch(e){document.querySelector('#view').innerHTML=`<div class="panel empty">${esc(e.message)} <button class="btn secondary" id="retry">Tentar novamente</button></div>`;document.querySelector('#retry')?.addEventListener('click',render)}}function bindView(){document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>goToPage(b.dataset.jump)));document.querySelector('#newRecord')?.addEventListener('click',()=>openForm());document.querySelector('#exportCsv')?.addEventListener('click',exportRows);document.querySelector('#filter')?.addEventListener('input',applyModuleFilters);document.querySelectorAll('.status-chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.status-chip').forEach(x=>x.classList.toggle('active',x===b));applyModuleFilters()}));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});const cards=document.querySelector('#recordsGrid'),table=document.querySelector('#tableView');if(cards&&table){const cardMode=b.dataset.view==='cards';cards.hidden=!cardMode;table.hidden=cardMode}}));document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openForm(items.find(i=>String(i.id)===b.dataset.edit))}));document.querySelectorAll('[data-archive]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();archive(b.dataset.archive)}));document.querySelectorAll('[data-open-record]').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('button'))return;openRecordDetails(el.dataset.openRecord)});el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&el.dataset.openRecord){e.preventDefault();openRecordDetails(el.dataset.openRecord)}})});document.querySelectorAll('[data-resource]').forEach(b=>b.addEventListener('click',()=>{resource=b.dataset.resource;render()}));document.querySelector('#exportSummary')?.addEventListener('click',()=>toast('Resumo exportado.'));document.querySelector('#closeDetail')?.addEventListener('click',()=>document.querySelector('#detailDialog').close());document.querySelector('#closeDetailSecondary')?.addEventListener('click',()=>document.querySelector('#detailDialog').close());document.querySelector('#detailEdit')?.addEventListener('click',e=>{const item=items.find(i=>String(i.id)===e.currentTarget.dataset.id);document.querySelector('#detailDialog').close();if(item)openForm(item)});document.querySelector('#detailArchive')?.addEventListener('click',e=>{const id=e.currentTarget.dataset.id;document.querySelector('#detailDialog').close();if(id)archive(id)})}
function openForm(item=null){editing=item;const p=resourceConfigs[resource]||pages[active];document.querySelector('#formTitle').textContent=(item?'Editar ':'Novo ')+p.title.toLowerCase();const host=document.querySelector('#fields');host.innerHTML=p.fields.map(([key,label,type,choices])=>{let value=item?.[key]??'';if(type==='datetime-local'&&value)value=String(value).slice(0,16);const wide=type==='textarea'?' wide':'';let input=type==='select'?`<select name="${key}">${choices.map(v=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(displayValue(v))}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" maxlength="2000">${esc(displayValue(value))}</textarea>`:`<input name="${key}" type="${type}" value="${esc(displayValue(value))}" ${type==='number'?'step="any"':''} maxlength="2000">`;return `<div class="field${wide}"><label>${esc(label)}${['patients:code','patients:full_name','appointments:starts_at','professionals:full_name','professionals:specialty','services:name','rooms:name','units:name','clinical_records:summary','documents:document_type','documents:title','payments:description','expenses:description','insurance_plans:name','insurance_claims:reference_code','inventory_items:code','inventory_items:name','suppliers:name','communications:subject','tasks:title'].includes(resource+':'+key)?'*':''}</label>${input}</div>`}).join('');document.querySelector('#editor').showModal()}
async function saveForm(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget).entries());for(const [k,v] of Object.entries(data)){if(v==='')delete data[k];else if(['amount_cents','duration_minutes','price_cents','quantity','minimum_quantity','seats'].includes(k))data[k]=Number(v)}try{await api('api/'+resource+(editing?'/'+editing.id:''),{method:editing?'PATCH':'POST',body:JSON.stringify(data)});document.querySelector('#editor').close();toast('Registro salvo e auditado.');render()}catch(e){toast(e.message)}}async function archive(id){if(!confirm('Arquivar este registro?'))return;try{await api('api/'+resource+'/'+id,{method:'DELETE'});toast('Registro arquivado.');render()}catch(e){toast(e.message)}}function exportRows(){if(!items.length){toast('Não há registros para exportar.');return}const keys=Object.keys(items[0]).filter(k=>!['tenant_id'].includes(k));const csv=[keys.join(';'),...items.map(x=>keys.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`meditrica-${resource||active}.csv`;a.click();URL.revokeObjectURL(a.href);toast('CSV baixado.')}document.querySelector('#recordForm').addEventListener('submit',saveForm);document.querySelector('#closeModal').addEventListener('click',()=>document.querySelector('#editor').close());document.querySelector('#cancel').addEventListener('click',()=>document.querySelector('#editor').close());(async()=>{try{const r=await api('auth/me');me=r.user;root.innerHTML=header();setSidebarOpen(false);window.matchMedia('(max-width:740px)').addEventListener('change',()=>setSidebarOpen(false));document.querySelector('#menu').setAttribute('aria-controls','sidebar');document.querySelector('#menu').addEventListener('click',()=>setSidebarOpen(!document.querySelector('#sidebar').classList.contains('open')));document.querySelector('#sidebarScrim').addEventListener('click',()=>setSidebarOpen(false));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#sidebar').classList.contains('open'))setSidebarOpen(false)});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>goToPage(b.dataset.page)));document.querySelector('#logout').addEventListener('click',async()=>{await api('auth/logout',{method:'POST'}).catch(()=>{});location.replace('/login')});render()}catch{location.replace('/login')}})();
</script></body></html>
