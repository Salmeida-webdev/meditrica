<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#292235">
<title>Medítrica — demonstração</title>
<style>
:root{--ink:#292235;--ink2:#4b4653;--muted:#847d8a;--coral:#e8755b;--lilac:#ece7f0;--paper:#f8f7f8;--white:#fff;--line:#ece9ed;--mint:#e5f3ee;--green:#38836f;--amber:#ae762c;--red:#b95555;--shadow:0 8px 30px #2922350c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-size:13px}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:780;font-size:19px;letter-spacing:-.05em;padding:0 8px 27px}.brand-mark{display:grid;place-items:center;width:31px;height:31px;background:var(--ink);color:white;border-radius:11px}.brand-mark svg{width:19px}.badge{display:inline-flex;background:#f7e8e3;color:#a75643;border-radius:20px;font-size:9px;padding:4px 8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:auto}.section-label{font-size:9px;color:#a49da8;text-transform:uppercase;letter-spacing:.12em;font-weight:750;padding:12px 10px 7px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#746d79;border-radius:9px;text-align:left;display:flex;align-items:center;gap:11px;padding:10px 11px;font-size:12px}.nav button svg{width:16px;height:16px;stroke:currentColor}.nav button:hover,.nav button.active{background:#f3eff5;color:var(--ink);font-weight:700}.nav button.active:before{content:"";width:3px;height:17px;border-radius:4px;background:var(--coral);margin-left:-8px;margin-right:5px}.side-bottom{margin-top:auto}.user{border-top:1px solid var(--line);padding:15px 5px 0;display:flex;gap:10px;align-items:center}.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:#f0e8f3;color:#614c6c;font-size:10px;font-weight:750}.user strong{display:block;font-size:11px}.user small{color:var(--muted);font-size:10px}
main{min-width:0}.top{height:67px;background:#ffffffd9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}.top-actions{display:flex;gap:9px;align-items:center}.unit,.period{height:34px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink2);padding:0 11px;font-size:11px}.icon-btn{border:1px solid var(--line);background:white;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#756e7a}.icon-btn svg{width:16px}.menu{display:none}.content{padding:27px 30px 42px;max-width:1420px;margin:auto}.demo-alert{background:#fff8e9;border:1px solid #f2e4c6;color:#82612f;padding:10px 13px;border-radius:10px;font-size:10px;display:flex;gap:8px;align-items:center;margin-bottom:20px}.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.title-row h1{margin:0;font-size:23px;letter-spacing:-.05em}.title-row p{margin:5px 0 0;color:var(--muted);font-size:11px}.btn{border:0;border-radius:9px;background:var(--ink);color:white;padding:10px 13px;font-size:11px;font-weight:650}.btn:hover{background:#40364e}.btn.ghost{border:1px solid var(--line);background:white;color:var(--ink2)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:15px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:16px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.stat-icon{width:29px;height:29px;border-radius:9px;background:#f3eef5;color:#705a7c;display:grid;place-items:center}.stat-icon svg{width:15px}.stat strong{font-size:23px;letter-spacing:-.06em;display:block;margin:10px 0 3px}.trend{font-size:9px;color:var(--green)}.trend.warn{color:var(--amber)}.grid-main{display:grid;grid-template-columns:1.35fr .85fr;gap:14px;margin-bottom:14px}.panel{padding:17px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}.panel-head h2{font-size:12px;margin:0;letter-spacing:-.02em}.panel-head span{color:var(--muted);font-size:9px}.bars{height:176px;display:flex;align-items:flex-end;justify-content:space-around;gap:12px;padding:9px 6px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent,transparent 42px,#f2f0f2 43px)}.bar-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;flex:1}.bar{width:min(30px,70%);background:#e8e1eb;border-radius:6px 6px 2px 2px;position:relative}.bar.focus{background:var(--coral)}.bar-label{font-size:9px;color:#9a939e;margin-bottom:-19px}.bar-value{font-size:8px;color:#8b8491}.legend{display:flex;gap:14px;color:var(--muted);font-size:9px;margin-top:22px}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--coral);margin-right:5px}.legend i.gray{background:#e8e1eb}.list{display:grid}.list-row{display:grid;grid-template-columns:43px 1fr auto;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #f1eff2}.list-row:first-child{border-top:0}.time{font-size:10px;color:#89828f}.person{display:flex;align-items:center;gap:8px;min-width:0}.person .avatar{width:27px;height:27px;border-radius:9px;flex:none}.person strong{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{font-size:9px;color:var(--muted)}.status{font-size:8px;padding:4px 7px;border-radius:30px;background:var(--mint);color:var(--green);white-space:nowrap}.status.wait{background:#fff1dd;color:var(--amber)}.status.cancel{background:#fae8e8;color:var(--red)}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.progress-row{display:flex;justify-content:space-between;font-size:10px;margin:14px 0 6px}.track{height:6px;border-radius:10px;background:#f0edf1;overflow:hidden}.track i{display:block;height:100%;border-radius:10px;background:var(--coral)}.donut-wrap{display:flex;gap:18px;align-items:center}.donut{width:105px;height:105px;border-radius:50%;background:conic-gradient(var(--coral) 0 44%,#ad96b8 44% 74%,#e9e3ef 74% 92%,#f4f1f3 92% 100%);position:relative;flex:none}.donut:after{content:"";position:absolute;inset:14px;background:white;border-radius:50%}.donut-center{position:absolute;z-index:1;inset:0;display:grid;place-content:center;text-align:center;font-size:17px;font-weight:750}.donut-center small{font-size:8px;color:var(--muted);font-weight:500}.key{display:grid;gap:8px;font-size:9px;color:var(--ink2)}.key span{display:flex;align-items:center;gap:6px}.key i{width:7px;height:7px;border-radius:2px;display:inline-block}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:10px;min-width:590px}.table th{text-align:left;color:#928b97;font-size:9px;font-weight:600;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:11px 10px;border-bottom:1px solid #f1eff2}.table tr:last-child td{border-bottom:0}.table .person{font-size:10px}.table .person .avatar{width:26px;height:26px}.muted{color:var(--muted)}.amount{font-weight:700}.positive{color:var(--green)}.negative{color:var(--red)}.bars-wide{height:210px;display:flex;align-items:flex-end;gap:18px;justify-content:space-around;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent,transparent 51px,#f2f0f2 52px);padding:10px}.bars-wide .bar-col{max-width:52px}.bars-wide .bar{width:31px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);background:#fff;border-radius:9px;height:34px;padding:0 11px;min-width:180px;font-size:10px;outline:none}.search:focus{border-color:#b69dbf}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:white;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);font-size:11px;z-index:5;display:none}.toast.show{display:block}.footnote{font-size:9px;color:#928b97;margin-top:12px}.empty{padding:32px;text-align:center;color:var(--muted)}.pill{background:#f3eff5;color:#705a7c;border-radius:20px;padding:5px 8px;font-size:9px}
@media(max-width:1060px){.app{grid-template-columns:215px 1fr}.content{padding:22px}.top{padding:0 22px}.stats{grid-template-columns:repeat(2,1fr)}.grid-main{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:740px){.app{display:block}.side{position:fixed;z-index:8;left:-260px;width:248px;transition:left .22s;box-shadow:var(--shadow)}.side.open{left:0}.menu{display:grid}.top{height:60px;padding:0 15px}.crumb{display:none}.content{padding:18px 14px 30px}.title-row{align-items:flex-start;flex-direction:column}.title-row h1{font-size:21px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:19px}.grid-3{grid-template-columns:1fr}.unit{max-width:145px}.top-actions{gap:6px}.grid-main{gap:10px}.panel{padding:14px}}
@media(max-width:400px){.stats{grid-template-columns:1fr 1fr}.unit{font-size:9px;max-width:125px}.period{padding:0 7px}.title-row .btn{width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
<a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18V6l8 8 8-8v12M4 11h4m8 0h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>medítrica <span class="badge">Demo</span></a>
<div class="section-label">Visão de gestão</div><nav class="nav" id="nav">
<button class="active" data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>Painel geral</button>
<button data-page="analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5m0 14h17M8 15l3-4 3 2 5-7"/></svg>Análise e indicadores</button>

<button data-page="patients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m3-13a4 4 0 0 1 0 8m1 2a5 5 0 0 1 2 4"/></svg>Pacientes</button>
<button data-page="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h11l4 4v14H5z"/><path d="M15 3v5h5M8 13h8M8 17h8"/></svg>Prontuários e documentos</button>

<button data-page="inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 7 9-4 9 4v10l-9 4-9-4z"/><path d="m3 7 9 4 9-4m-9 4v10M7 5l9 4"/></svg>Estoque e compras</button>

</nav>
<div class="side-bottom"><div class="user"><span class="avatar">MD</span><div><strong>Gestor demonstração</strong><small>Conta fictícia · somente leitura</small></div></div></div>
</aside>
<main><header class="top"><div style="display:flex;align-items:center;gap:11px"><button class="icon-btn menu" id="toggle" aria-label="Abrir navegação">☰</button><div class="crumb">Medítrica <span style="color:#bbb">/</span> <b id="crumb">Painel geral</b></div></div><div class="top-actions"><select class="unit" aria-label="Unidade"><option>Unidade Centro</option><option>Unidade Jardins</option><option>Rede completa</option></select><button class="icon-btn" id="notice" aria-label="Notificações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></svg></button><a href="index.html" class="icon-btn" aria-label="Voltar à página inicial">⌂</a></div></header>
<div class="content"><div class="demo-alert"><b>DEMONSTRAÇÃO</b><span>Todos os dados desta tela são sintéticos e não representam pacientes ou uma clínica real. Área apenas ilustrativa, sem operações clínicas.</span></div><div id="view"></div></div></main>
</div><div class="toast" id="toast" role="status"></div>
<script>
const month="Novembro 2026";
const metrics=[["Consultas agendadas","32","+8,4% vs. período anterior","▦"],["Confirmadas","27","84% da agenda","✓"],["Ocupação média","82%","+5,2 p.p. no mês","◷"],["Receita recebida","R$ 48.650","+12,6% no mês","R$"]];
const appointments=[["08:30","Atendimento fictício 01","Cardiologia · Dr. Caio Exemplo","Confirmado"],["09:15","Atendimento fictício 02","Clínica geral · Dra. Bia Exemplo","Confirmado"],["10:00","Atendimento fictício 03","Dermatologia · Dra. Lia Exemplo","A confirmar"],["10:45","Atendimento fictício 04","Ortopedia · Dr. Nilo Exemplo","Confirmado"],["11:30","Atendimento fictício 05","Pediatria · Dra. Eva Exemplo","Em recepção"]];
const patients=[["PX-10041","Pessoa Fictícia 01","(11) 90000-1001","Cardiologia","Ativo"],["PX-10042","Pessoa Fictícia 02","(11) 90000-1002","Clínica geral","Ativo"],["PX-10043","Pessoa Fictícia 03","(11) 90000-1003","Dermatologia","Retorno"],["PX-10044","Pessoa Fictícia 04","(11) 90000-1004","Ortopedia","Ativo"],["PX-10045","Pessoa Fictícia 05","(11) 90000-1005","Pediatria","Ativo"],["PX-10046","Pessoa Fictícia 06","(11) 90000-1006","Endocrinologia","Aguardando"]];
const staff=[["CE","Dr. Caio Exemplo","Cardiologia","Centro","18 consultas"],["BE","Dra. Bia Exemplo","Clínica geral","Centro","22 consultas"],["LE","Dra. Lia Exemplo","Dermatologia","Jardins","16 consultas"],["NE","Dr. Nilo Exemplo","Ortopedia","Centro","14 consultas"]];
const navLabels={overview:"Painel geral",analytics:"Análise e indicadores",schedule:"Agenda e recepção",patients:"Pacientes",records:"Prontuários e documentos",finance:"Financeiro",insurance:"Convênios",inventory:"Estoque e compras",team:"Equipe e unidades",communications:"Relacionamento"};
const view=document.querySelector("#view"),crumb=document.querySelector("#crumb");
function toast(s){let t=document.querySelector("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
function statCards(items){return '<div class="stats">'+items.map((m,i)=>'<article class="stat"><div class="stat-top"><span>'+m[0]+'</span><span class="stat-icon">'+m[3]+'</span></div><strong>'+m[1]+'</strong><span class="trend '+(i===2?'warn':'')+'">'+m[2]+'</span></article>').join("")+'</div>'}
function barChart(labels,values,wide=false){let max=Math.max(...values);return '<div class="'+(wide?'bars-wide':'bars')+'">'+labels.map((l,i)=>'<div class="bar-col"><span class="bar-value">'+(wide?values[i]:"")+'</span><div class="bar '+(i===labels.length-1?'focus':'')+'" style="height:'+Math.max(12,values[i]/max*135)+'px"></div><span class="bar-label">'+l+'</span></div>').join("")+'</div>'}
function appointmentList(rows=appointments.slice(0,4)){return '<div class="list">'+rows.map((a,i)=>'<div class="list-row"><span class="time">'+a[0]+'</span><div class="person"><span class="avatar">'+String(i+1).padStart(2,"0")+'</span><span><strong>'+a[1]+'</strong><small>'+a[2]+'</small></span></div><span class="status '+(a[3]==="A confirmar"?"wait":"")+'">'+a[3]+'</span></div>').join("")+'</div>'}
function pageHead(title,desc,button){return '<div class="title-row"><div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(button?'<button class="btn" onclick="toast(\'Ação disponível na versão operacional\')">'+button+'</button>':'')+'</div>'}
function table(rows,headers){return '<div class="table-wrap"><table class="table"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i===0&&String(c).startsWith("PX-")?'<span class="pill">'+c+'</span>':c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
function overview(){return pageHead("Bom dia, equipe","Resumo operacional · "+month,"Exportar resumo")+statCards(metrics)+'<div class="grid-main"><section class="panel"><div class="panel-head"><h2>Atendimentos ao longo do mês</h2><span>Volume por semana</span></div>'+barChart(["S1","S2","S3","S4","S5"],[125,148,139,171,90])+'<div class="legend"><span><i></i>Atendimentos realizados</span><span><i class="gray"></i>Agenda prevista</span></div></section><section class="panel"><div class="panel-head"><h2>Próximos atendimentos</h2><span>Hoje · 5 na fila</span></div>'+appointmentList()+'</section></div><div class="grid-3"><section class="panel"><div class="panel-head"><h2>Ocupação por especialidade</h2><span>Este mês</span></div><div class="donut-wrap"><div class="donut"><div class="donut-center">82%<small>ocupação</small></div></div><div class="key"><span><i style="background:#e8755b"></i>Cardiologia · 44%</span><span><i style="background:#ad96b8"></i>Clínica geral · 30%</span><span><i style="background:#e9e3ef"></i>Outras · 18%</span></div></div></section><section class="panel"><div class="panel-head"><h2>Pendências da equipe</h2><span>Atualizado agora</span></div><div class="progress-row"><span>Confirmações pendentes</span><b>5</b></div><div class="progress-row"><span>Retornos para agendar</span><b>12</b></div><div class="progress-row"><span>Contas a conferir</span><b>3</b></div><p class="footnote">Indicadores ilustrativos para demonstração.</p></section><section class="panel"><div class="panel-head"><h2>Resumo financeiro</h2><span>Novembro</span></div><div class="progress-row"><span>Receita recebida</span><b>R$ 48.650</b></div><div class="progress-row"><span>A receber</span><b>R$ 12.340</b></div><div class="progress-row"><span>Despesas previstas</span><b>R$ 18.720</b></div><p class="footnote">Valores sintéticos.</p></section></div>'}
function analytics(){return pageHead("Análise e indicadores","Métricas operacionais e financeiras com período e unidade definidos.","Baixar relatório")+statCards([["Atendimentos no período","684","+9,1% vs. período anterior","▦"],["Taxa de comparecimento","91,2%","+2,4 p.p. no período","✓"],["Tempo médio até consulta","6,4 dias","−0,8 dia no período","◷"],["Receita líquida","R$ 48.650","+11,8% no período","R$"]])+'<section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><h2>Evolução de atendimentos</h2><span style="display:block;margin-top:5px">Comparação semanal · dados demonstrativos</span></div><select class="period" id="analyticPeriod"><option>Últimos 30 dias</option><option>Últimos 90 dias</option><option>Este ano</option></select></div>'+barChart(["01–07","08–14","15–21","22–28","29–30"],[116,147,132,176,88],true)+'<div class="legend"><span><i></i>Atendimentos realizados</span><span><i class="gray"></i>Período anterior</span></div></section><div class="grid-3"><section class="panel"><div class="panel-head"><h2>Origem dos pacientes</h2><span>Novos cadastros</span></div><div class="progress-row"><span>Indicação</span><b>38%</b></div><div class="track"><i style="width:38%"></i></div><div class="progress-row"><span>Busca online</span><b>27%</b></div><div class="track"><i style="width:27%;background:#ad96b8"></i></div><div class="progress-row"><span>Retorno</span><b>21%</b></div><div class="track"><i style="width:21%;background:#8fb7a7"></i></div><div class="progress-row"><span>Outros canais</span><b>14%</b></div><div class="track"><i style="width:14%;background:#d8c5b1"></i></div></section><section class="panel"><div class="panel-head"><h2>Indicadores de agenda</h2><span>Últimos 30 dias</span></div><div class="progress-row"><span>Taxa de ocupação</span><b>82%</b></div><div class="track"><i style="width:82%"></i></div><div class="progress-row"><span>Faltas</span><b>8,8%</b></div><div class="track"><i style="width:9%;background:#d99028"></i></div><div class="progress-row"><span>Cancelamentos</span><b>6,1%</b></div><div class="track"><i style="width:6%;background:#ad96b8"></i></div><p class="footnote">Definição: faltas ÷ consultas agendadas elegíveis.</p></section><section class="panel"><div class="panel-head"><h2>Receita por unidade</h2><span>Novembro</span></div><div class="progress-row"><span>Unidade Centro</span><b>R$ 29.400</b></div><div class="progress-row"><span>Unidade Jardins</span><b>R$ 19.250</b></div><div class="progress-row"><span>Consolidado</span><b>R$ 48.650</b></div><p class="footnote">Métricas sintéticas; regras de cálculo serão documentadas no produto.</p></section></div>'}
function schedule(){return pageHead("Agenda e recepção","Visão diária por unidade · sexta-feira, 20 de novembro","Novo agendamento")+'<div class="panel"><div class="panel-head"><h2>Atendimentos de hoje</h2><span>32 agendados · 27 confirmados</span></div>'+appointmentList(appointments)+'</div>'}
function patientRows(){return patients.map(p=>['<span class="pill">'+p[0]+'</span>','<div class="person"><span class="avatar">'+p[1].split(" ").slice(-1)[0].slice(0,1)+'</span><strong>'+p[1]+'</strong></div>',p[2],p[3],'<span class="status '+(p[4]==="Aguardando"?"wait":"")+'">'+p[4]+'</span>'])}
function patientsPage(){return pageHead("Pacientes","Cadastro e relacionamento · base sintética de demonstração","Novo cadastro")+'<section class="panel"><div class="panel-head"><h2>Cadastro de pacientes</h2><div class="toolbar"><input class="search" id="patientSearch" placeholder="Buscar cadastro fictício…" aria-label="Buscar cadastro"></div></div><div id="patientTable">'+table(patientRows(),["Código","Paciente","Contato fictício","Especialidade","Situação"])+'</div><p class="footnote">Todos os nomes, contatos e códigos são fictícios.</p></section>'}
function records(){return pageHead("Prontuários e documentos","Prévia do fluxo clínico · conteúdo real não habilitado","Modelos de documento")+'<div class="grid-3"><section class="panel"><div class="panel-head"><h2>Atendimentos registrados</h2><span>Este mês</span></div><strong style="font-size:26px">418</strong><p class="muted">Registros fictícios vinculados a atendimentos de demonstração.</p></section><section class="panel"><div class="panel-head"><h2>Documentos emitidos</h2><span>Este mês</span></div><strong style="font-size:26px">126</strong><p class="muted">Modelos, autoria e histórico previstos na operação.</p></section><section class="panel"><div class="panel-head"><h2>Permissões clínicas</h2><span>Configuração</span></div><p>Prontuários com acesso controlado por profissional e unidade. Nenhum dado clínico real nesta demonstração.</p></section></div><section class="panel" style="margin-top:14px"><div class="panel-head"><h2>Fluxo de atendimento demonstrativo</h2><span>Exemplo fictício</span></div>'+table([["09:15","Atendimento fictício 02","Clínica geral","Em atendimento","Profissional responsável"],["10:00","Atendimento fictício 03","Dermatologia","Aguardando","Profissional responsável"],["10:45","Atendimento fictício 04","Ortopedia","Concluído","Profissional responsável"]],["Horário","Registro","Especialidade","Etapa","Acesso"])+'</section>'}
function finance(){return pageHead("Financeiro","Acompanhamento de recebimentos, despesas e repasses","Registrar lançamento")+statCards([["Recebido no mês","R$ 48.650","+12,6%","R$"],["Em aberto","R$ 12.340","42 títulos","◷"],["Despesas","R$ 18.720","31 lançamentos","−"],["Repasses previstos","R$ 21.600","8 profissionais","↗"]])+'<section class="panel"><div class="panel-head"><h2>Movimentações recentes</h2><span>Valores fictícios</span></div>'+table([["18 nov","Consulta · Centro","Recebimento","R$ 420,00","<span class=positive>Recebido</span>"],["18 nov","Material clínico","Despesa","R$ 860,00","<span class=negative>Pago</span>"],["19 nov","Consulta · Jardins","Recebimento","R$ 350,00","<span class=positive>Recebido</span>"],["20 nov","Serviços e utilidades","Despesa","R$ 1.240,00","<span class=negative>A pagar</span>"]],["Data","Descrição","Tipo","Valor","Status"])+'</section>'}
function insurance(){return pageHead("Convênios","Autorizações e faturamento · dados de demonstração","Adicionar convênio")+'<div class="stats">'+[['Guias em análise','18','lote demonstrativo','▤'],['Aguardando autorização','7','acompanhamento','◷'],['Receita prevista','R$ 26.480','valores fictícios','R$'],['Glosas em recurso','3','revisão necessária','!']].map(m=>'<article class="stat"><div class="stat-top">'+m[0]+'<span class="stat-icon">'+m[3]+'</span></div><strong>'+m[1]+'</strong><span class="trend">'+m[2]+'</span></article>').join("")+'</div><section class="panel"><div class="panel-head"><h2>Operadoras cadastradas</h2><span>Exemplos fictícios</span></div>'+table([["Plano Horizonte","24 guias","R$ 12.440","Em processamento"],["Saúde Integral","18 guias","R$ 8.920","Enviado"],["Rede Bem-Estar","11 guias","R$ 5.120","Aguardando"]],["Operadora demonstrativa","Guias","Valor estimado","Status"])+'</section>'}
function inventory(){return pageHead("Estoque e compras","Materiais, fornecedores e alertas de reposição","Nova movimentação")+'<div class="stats">'+[['Itens ativos','284','cadastros fictícios','◇'],['Reposição sugerida','12','abaixo do mínimo','!'],['Lotes próximos do vencimento','4','janela de 30 dias','◷'],['Compras previstas','R$ 6.870','este mês','R$']].map(m=>'<article class="stat"><div class="stat-top">'+m[0]+'<span class="stat-icon">'+m[3]+'</span></div><strong>'+m[1]+'</strong><span class="trend warn">'+m[2]+'</span></article>').join("")+'</div><section class="panel"><div class="panel-head"><h2>Itens com acompanhamento</h2><span>Estoque fictício</span></div>'+table([["MAT-021","Luvas de procedimento","8 cx","20 cx","Reposição"],["MAT-044","Máscara cirúrgica","34 cx","25 cx","Regular"],["MAT-087","Gaze estéril","6 pct","15 pct","Reposição"],["MAT-109","Solução antisséptica","12 un","10 un","Regular"]],["Código","Material","Disponível","Mínimo","Situação"])+'</section>'}
function team(){return pageHead("Equipe e unidades","Profissionais, especialidades e estrutura da clínica","Convidar profissional")+'<section class="panel"><div class="panel-head"><h2>Equipe demonstrativa</h2><span>2 unidades · 12 profissionais</span></div>'+table(staff.map(p=>['<div class="person"><span class="avatar">'+p[0]+'</span><strong>'+p[1]+'</strong></div>',p[2],p[3],p[4],'<span class="status">Ativo</span>']),["Profissional fictício","Especialidade","Unidade","Agenda do dia","Situação"])+'</section><div class="grid-3" style="margin-top:14px"><section class="panel"><div class="panel-head"><h2>Unidade Centro</h2><span class="status">Ativa</span></div><p>7 profissionais · 4 salas<br><span class="muted">Segunda a sexta · 07h–19h</span></p></section><section class="panel"><div class="panel-head"><h2>Unidade Jardins</h2><span class="status">Ativa</span></div><p>5 profissionais · 3 salas<br><span class="muted">Segunda a sábado · 08h–18h</span></p></section><section class="panel"><div class="panel-head"><h2>Acessos por perfil</h2><span>RBAC previsto</span></div><p>Gestão · Recepção · Profissional · Financeiro<br><span class="muted">Permissões serão aplicadas no servidor.</span></p></section></div>'}
function communications(){return pageHead("Relacionamento","Confirmações, retornos e preferências de contato","Nova campanha")+'<section class="panel"><div class="panel-head"><h2>Fila de comunicação fictícia</h2><span>Preferências e consentimentos previstos</span></div>'+table([["Atendimento fictício 02","Confirmação de consulta","Hoje · 14:00","WhatsApp (simulado)","Agendado"],["Atendimento fictício 03","Instruções pré-atendimento","Hoje · 16:30","E-mail (simulado)","Aguardando"],["Atendimento fictício 04","Lembrete de retorno","Amanhã · 09:00","Canal preferido","Rascunho"]],["Contato fictício","Finalidade","Envio","Canal","Status"])+'<p class="footnote">Nenhuma mensagem é enviada nesta demonstração.</p></section>'}
const renderers={overview,analytics,schedule,patients:patientsPage,records,finance,insurance,inventory,team,communications};
function show(name){const label=navLabels[name]||navLabels.overview;crumb.textContent=label;view.innerHTML=renderers[name]();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===name));const search=document.querySelector("#patientSearch");if(search)search.addEventListener("input",()=>{const q=search.value.toLowerCase();const filtered=patients.filter(p=>p.join(" ").toLowerCase().includes(q));document.querySelector("#patientTable").innerHTML=table(filtered.map(p=>['<span class="pill">'+p[0]+'</span>','<div class="person"><span class="avatar">'+p[1].slice(-1)+'</span><strong>'+p[1]+'</strong></div>',p[2],p[3],'<span class="status">'+p[4]+'</span>']),["Código","Paciente","Contato fictício","Especialidade","Situação"])});const period=document.querySelector("#analyticPeriod");if(period)period.addEventListener("change",()=>toast("Filtro aplicado: "+period.value));}
document.querySelector("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(!b)return;show(b.dataset.page);document.querySelector("#side").classList.remove("open")});
document.querySelector("#toggle").addEventListener("click",()=>document.querySelector("#side").classList.toggle("open"));
document.querySelector("#notice").addEventListener("click",()=>toast("Você está vendo um ambiente de demonstração."));
show("overview");
</script>
</body>
</html>
